
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Movie Article Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      padding: 20px;
    }
    h1 {
      color: #00e676;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
    }
    .output {
      margin-top: 30px;
      background: #222;
      padding: 20px;
      border-radius: 8px;
    }
    textarea {
      width: 100%;
      height: 300px;
      background-color: #000;
      color: #0f0;
      font-family: monospace;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h1>🎬 AI Movie Article Generator</h1>
  <p>Type the name of a movie below and click "Generate Article" to get an HTML block you can use in your website.</p>
  <input type="text" id="movieInput" placeholder="e.g., Pushpa 2" />
  <button onclick="generateArticle()">Generate Article</button>

  <div class="output" id="output" style="display:none;">
    <h2>Generated HTML Article:</h2>
    <textarea id="articleBox" readonly></textarea>
  </div>

  <script>
    function generateArticle() {
      const movie = document.getElementById('movieInput').value.trim();
      if (!movie) return alert("Please enter a movie name.");

      const html = `
<div class="article">
  <h2>🚨 ${movie}</h2>
  <img src="https://via.placeholder.com/800x400?text=${encodeURIComponent(movie)}+Poster" alt="${movie} Poster" />
  <p><strong>🧑‍🎤 Cast:</strong> Actor 1, Actor 2, Actor 3</p>
  <p><strong>⭐ Rating:</strong> 8.0/10 (IMDb)</p>
  <p><strong>📖 Description:</strong> A thrilling story of ${movie}, featuring intense drama, action, and emotion. The movie explores complex themes with a stunning performance by the cast.</p>
  <p><strong>▶️ Watch Trailer:</strong> 
    <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(movie)}+official+trailer" target="_blank">YouTube Trailer</a>
  </p>
</div>`.trim();

      document.getElementById('output').style.display = 'block';
      document.getElementById('articleBox').value = html;
    }
  </script>
</body>
</html>
